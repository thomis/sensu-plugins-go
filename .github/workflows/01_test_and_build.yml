name: 01 - Test and Build

on:
  push:
    branches:
      - "*"

  pull_request:
    branches:
      - "*"

  schedule:
  - cron: 0 2 * * 3,6

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORACLE_HOME: /opt/instantclient_23_8
      LD_LIBRARY_PATH: /opt/instantclient_23_8
      OCI_DIR: /opt/instantclient_23_8
      NLS_LANG: AMERICAN_AMERICA.AL32UTF8

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: '.tool-versions'
          check-latest: true

      - name: Install Oracle instant client
        run: |
          mkdir -p /opt && cd /opt
          curl https://download.oracle.com/otn_software/linux/instantclient/2380000/instantclient-basic-linux.x64-23.8.0.25.04.zip --output instantclient.zip
          curl https://download.oracle.com/otn_software/linux/instantclient/2380000/instantclient-sdk-linux.x64-23.8.0.25.04.zip --output instantclient_sdk.zip
          unzip -o instantclient.zip
          unzip -o instantclient_sdk.zip

      - name: Install staticcheck
        run: |
          # Build staticcheck against the newest golang.org/x/tools: the
          # stable release pins an older x/tools whose export-data decoder
          # cannot read freshly released Go toolchains ("export data
          # version X is greater than maximum supported version Y").
          d=$(mktemp -d)
          (cd "$d" && go mod init scbuild >/dev/null 2>&1 \
            && go get honnef.co/go/tools/cmd/staticcheck@latest golang.org/x/tools@latest \
            && go build -o "$(go env GOPATH)/bin/staticcheck" honnef.co/go/tools/cmd/staticcheck)

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Build
        run: make test build
